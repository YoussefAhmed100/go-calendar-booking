services:
  db:
    image: postgres:16-alpine
    container_name: calendar_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
  pgadmin:
     image: dpage/pgadmin4:latest
     container_name: calendar_booking_pgadmin
     restart: unless-stopped
     environment:
       PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
       PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
     ports:
       - "5050:80"
     depends_on:
       db:
         condition: service_healthy
  api:
    build: .
    container_name: calendar_booking_api
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the compose network the DB host is the service name
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - .git/
            - .env
            - tmp/
            - vendor/
            - "*.md"
volumes:
  pgdata: